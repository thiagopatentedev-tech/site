<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Jogos da Bibel</title><meta name="description" content="Coleção de joguinhos de alfabetização para crianças, feitos com IA."><meta property="og:title" content="Jogos da Bibel"><meta property="og:description" content="Joguinhos de alfabetização feitos com IA."><meta property="og:image" content="https://www.thiagopatente.com.br/jogo/og.png"><meta property="og:type" content="website"><meta property="og:url" content="https://www.thiagopatente.com.br/jogo/"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://www.thiagopatente.com.br/jogo/og.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/jogo/assets/style.css"><style>
.head{text-align:center;padding:18px 0 6px}.head .k{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral);font-weight:600}
.head h1{font-size:clamp(40px,12vw,64px)}.head p{color:#7a6f5c;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr 1fr}}
.tile{background:#fff;border:3px solid #efe7d8;border-radius:22px;padding:18px 12px;text-align:center;text-decoration:none;color:var(--tinta);box-shadow:0 5px 0 rgba(124,36,16,.10)}
.tile:active{transform:translateY(2px)}.tile .te{font-size:46px}.tile .tt{font-weight:700;font-size:19px;color:var(--terra);margin-top:6px}.tile .td{font-size:13px;color:#8a7f6c;margin-top:2px;line-height:1.3}
.foot{text-align:center;color:#8a7f6c;font-size:13px;margin:26px 0 10px}
</style></head><body>
<button class="lang-btn" id="langBtn" aria-label="Português / English" style="position:fixed;top:12px;right:12px"><span class="flag pt on"></span><span class="flag en"></span></button>
<div class="wrap">
 <div class="head"><div class="k">Jogos da Bibel</div><h1 id="h1">Aprender brincando</h1><p id="tag">joguinhos de alfabetização, feitos com IA</p></div>
 <div class="grid2" id="grid"></div>
 <div class="foot" id="foot">Feito por Thiago Patente, para as duas filhas. · <a href="https://www.thiagopatente.com.br" style="color:var(--terra)">thiagopatente.com.br</a></div>
</div>
<script>
var TILES=[
 {href:"/jogo/copa/",e:"🇧🇷🏆",pt:["Copa das Bandeiras","memória das bandeiras da Copa"],en:["Flag Cup","World Cup flag memory match"]},
 {href:"/jogo/rimas/",e:"🦆🐱",pt:["As Rimas","memória das palavras que rimam"],en:["Rhymes","memory match of rhyming words"]},
 {href:"/jogo/som-da-letra/",e:"🔤",pt:["O Som da Letra","qual figura começa com a letra"],en:["Letter Sound","which picture starts with the letter"]},
 {href:"/jogo/primeira-letra/",e:"🅰️",pt:["A Primeira Letra","com que letra a palavra começa"],en:["First Letter","which letter the word starts with"]},
 {href:"/jogo/silabas/",e:"🍌",pt:["Monta a Sílaba","junte as sílabas e forme a palavra"],en:["Build the Syllable","put the syllables together"]},
 {href:"/jogo/caca-letra/",e:"🔎",pt:["Caça à Letra","toque em todas as letras iguais"],en:["Letter Hunt","touch all the matching letters"]},
 {href:"/jogo/contar/",e:"🔢",pt:["Conta os Bichos","conte e toque no número certo"],en:["Count the Animals","count and touch the right number"]},
 {href:"/jogo/cores/",e:"🎨",pt:["As Cores","toque na cor que eu falar"],en:["Colors","touch the color I say"]},
 {href:"/jogo/sombras/",e:"🦆🌑",pt:["A Sombra Certa","ache cada figura e a sua sombra"],en:["Right Shadow","match each picture to its shadow"]},
 {href:"/jogo/sequencia/",e:"1️⃣2️⃣3️⃣",pt:["A Sequência","coloque os números em ordem"],en:["The Sequence","put the numbers in order"]},
 {href:"/jogo/diferente/",e:"🍎🍎🍌",pt:["Qual é Diferente","toque no que é diferente"],en:["Odd One Out","touch the one that's different"]}
];
var HEAD={pt:{h1:"Aprender brincando",tag:"joguinhos de alfabetização, feitos com IA",foot:'Feito por Thiago Patente, para as duas filhas. · <a href="https://www.thiagopatente.com.br" style="color:var(--terra)">thiagopatente.com.br</a>'},
 en:{h1:"Learn by playing",tag:"early learning games, made with AI",foot:'Made by Thiago Patente, for his two daughters. · <a href="https://www.thiagopatente.com.br" style="color:var(--terra)">thiagopatente.com.br</a>'}};
function getLang(){try{return localStorage.getItem('bibel_lang')||'pt';}catch(e){return 'pt';}}
function setLang(l){try{localStorage.setItem('bibel_lang',l);}catch(e){}}
var lang=getLang();
function render(){
 document.getElementById('h1').textContent=HEAD[lang].h1;
 document.getElementById('tag').textContent=HEAD[lang].tag;
 document.getElementById('foot').innerHTML=HEAD[lang].foot;
 var grid=document.getElementById('grid');grid.innerHTML='';
 TILES.forEach(function(t){
  var d=t[lang];
  var a=document.createElement('a');a.className='tile';a.href=t.href;
  a.innerHTML='<div class="te">'+t.e+'</div><div class="tt">'+d[0]+'</div><div class="td">'+d[1]+'</div>';
  grid.appendChild(a);
 });
 var lb=document.getElementById('langBtn');
 lb.querySelector('.pt').classList.toggle('on',lang==='pt');
 lb.querySelector('.en').classList.toggle('on',lang==='en');
}
document.getElementById('langBtn').onclick=function(){lang=lang==='pt'?'en':'pt';setLang(lang);render();};
render();
</script>
</body></html>
